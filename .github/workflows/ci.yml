# CI do Verbete — Fase 2
# build-and-test: lint + typecheck + unit + build (sem segredos).
# integration: Supabase LOCAL (Docker) no runner com as migrations aplicadas
# do zero — valida o motor SQL inteiro sem tocar produção e sem segredos.
# e2e-visual: specs do Playwright com o Supabase simulado (sem Supabase local),
# em 2 máquinas: projeto visual-screens (só o screens) e projeto visual.
# android: Gradle + checagens do APK (scripts/ci-android.mjs), sem segredos e
# sem AAB. Todos os jobs começam juntos: nenhum consome artefato de outro, e o
# run só fica verde com todos verdes.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Push novo no mesmo PR cancela o run anterior (SHA obsoleto). No master cada
# push tem grupo próprio (run_id): nada é cancelado nem enfileirado.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # O lockfile é gerado com npm 11 (local); o npm 10 do runner resolve a
      # árvore diferente e falha o `npm ci` (Missing: lru-cache from lock file).
      - name: Alinha versão do npm
        run: npm install -g npm@11
      - name: Instala dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários
        run: npm run test
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # O lockfile é gerado com npm 11 (local); o npm 10 do runner resolve a
      # árvore diferente e falha o `npm ci` (Missing: lru-cache from lock file).
      - name: Alinha versão do npm
        run: npm install -g npm@11
      - name: Instala dependências
        run: npm ci
      - name: Sobe Supabase local (aplica migrations do zero)
        run: npx supabase start
      - name: Suíte de integração (identidade + rodada E2E)
        run: |
          STATUS=$(npx supabase status -o env)
          export SUPA_URL=$(echo "$STATUS" | grep -E '^API_URL=' | cut -d= -f2- | tr -d '"')
          export ANON=$(echo "$STATUS" | grep -E '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          export DB_URL=$(echo "$STATUS" | grep -E '^DB_URL=' | cut -d= -f2- | tr -d '"')
          echo "API=$SUPA_URL DB=$DB_URL"
          npm run test:integration
      - name: Instala Chromium do Playwright
        run: npx playwright install chromium
      - name: E2E Playwright stateful (smoke + partida multiplayer, Supabase local)
        run: |
          STATUS=$(npx supabase status -o env)
          export VITE_SUPABASE_URL=$(echo "$STATUS" | grep -E '^API_URL=' | cut -d= -f2- | tr -d '"')
          export VITE_SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | grep -E '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          npx playwright test --project=stateful

  # Specs do Playwright com o Supabase SIMULADO no navegador (e2e/visual =
  # projeto `visual` do playwright.config.ts): não precisam do Supabase local,
  # então começam junto com os outros jobs, fora do caminho do integration.
  # Mesmas regras de antes (workers 1, retries do CI). A URL é a padrão do
  # Supabase local, mas aqui NADA escuta nela: o que escapasse do mock
  # falharia em vez de tocar um banco.
  # 2 máquinas, 1 worker em cada (2 workers na MESMA máquina flakaram na
  # Fase 2), divididas por PROJETO: visual-screens (só o screens, ~4,5 min) e
  # visual (todo o resto de e2e/visual — spec novo entra sozinho). O shard
  # nativo repartia por contagem e deixava 79 × 29 testes (10m10s × 1m58s).
  # fail-fast desligado: um lado vermelho não cancela o outro, e o run só
  # fecha verde com os dois verdes.
  e2e-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [visual-screens, visual]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # O lockfile é gerado com npm 11 (local); o npm 10 do runner resolve a
      # árvore diferente e falha o `npm ci` (Missing: lru-cache from lock file).
      - name: Alinha versão do npm
        run: npm install -g npm@11
      - name: Instala dependências
        run: npm ci
      - name: Instala Chromium do Playwright
        run: npx playwright install chromium
      - name: E2E Playwright visual (Supabase simulado, sem Supabase local)
        run: npx playwright test --project=${{ matrix.project }}
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-visual-mock

  # Antes era a última suíte do run-integration (2,5–3,5 min no caminho
  # crítico, dividindo o runner com o Supabase local). Mesmo script, mesmas
  # checagens; com ANDROID_REQUIRED o script FALHA em vez de pular se faltar o
  # SDK — nunca verde sem build. Sem segredos e sem AAB: a release assinada
  # segue só no workflow_dispatch do android.yml.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # O lockfile é gerado com npm 11 (local); o npm 10 do runner resolve a
      # árvore diferente e falha o `npm ci` (Missing: lru-cache from lock file).
      - name: Alinha versão do npm
        run: npm install -g npm@11
      - name: Instala dependências
        run: npm ci
      - name: Build Android + checagens do APK (scripts/ci-android.mjs)
        run: node scripts/ci-android.mjs
        env:
          ANDROID_REQUIRED: "1"
