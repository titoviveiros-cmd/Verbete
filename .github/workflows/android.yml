name: Android

# Builda o app Android (a máquina de dev não tem SDK — o runner tem).
# - Sempre: assembleDebug (valida gradle/manifest/recursos a cada push que
#   toca android/ ou o bundle web) e sobe o APK de debug como artifact.
# - Release assinada (AAB p/ Play Store): só quando os secrets do keystore
#   existem — ver docs/store-checklist.md.
on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/**"
      - "package*.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Canal do rodapé do app (internal = Teste interno; production = AAB da loja)"
        type: choice
        options: [internal, preview, production]
        default: internal

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Alinhar npm com o lockfile
        run: npm install -g npm@11

      - run: npm ci

      - name: Bundle web offline (modo capacitor)
        run: npx vite build --mode capacitor
        env:
          # Canal decidido no BUILD (src/lib/version-label.ts). Sem input
          # (push no master) = "internal", como antes. Valor inválido
          # BLOQUEIA o build (resolveReleaseChannel).
          VITE_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'internal' }}

      - name: Capacitor sync
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Permitir execução do gradlew (checkout do Windows)
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Testes unitários Android
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: verbete-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ===== Release assinada (opcional — exige secrets) =====
      # ANDROID_KEYSTORE_BASE64: keystore .jks em base64
      # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: Preparar keystore
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Sem ANDROID_KEYSTORE_BASE64 — pulando release assinada."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release AAB (assinado)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        run: |
          if [ ! -f key.properties ]; then
            echo "Sem key.properties — pulando bundleRelease."
            exit 0
          fi
          ./gradlew bundleRelease --no-daemon

      # Auditoria do AAB ANTES do upload do artefato (só dados públicos): o
      # bundle web embutido (config pública, nenhum segredo, canal pedido,
      # versão do build.gradle, build ID = commit) e, no resumo do job, o
      # sha256 do AAB e a impressão digital do certificado de UPLOAD (lida do
      # próprio AAB; esperado FA:CC…54:65, o mesmo do vc7/vc8).
      - name: Auditar o AAB (bundle web, canal, versão, certificado)
        if: ${{ github.event_name == 'workflow_dispatch' && hashFiles('android/key.properties') != '' }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          node scripts/verify-native-artifact.mjs "$AAB" \
            --channel "${{ github.event.inputs.release_channel || 'internal' }}" \
            --build-id "$GITHUB_SHA"
          CERT=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | awk '{print $2}')
          {
            echo "### AAB ${{ github.event.inputs.release_channel || 'internal' }}"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- sha256: \`$(sha256sum "$AAB" | cut -d' ' -f1)\`"
            echo "- tamanho: $(stat -c%s "$AAB") B"
            echo "- certificado de upload (SHA-256): \`${CERT:-NÃO ASSINADO}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$CERT" = "FA:CC:D8:6C:68:B9:66:9D:A7:DB:59:67:5F:8E:17:4F:A1:15:BF:F2:5A:3A:C8:A4:ED:E5:C8:CD:58:39:54:65" ] || {
            echo "::error::certificado de upload inesperado (${CERT:-ausente}); esperado FA:CC…54:65 (vc7/vc8)"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' && hashFiles('android/key.properties') != '' }}
        with:
          name: verbete-release-aab-${{ github.event.inputs.release_channel || 'internal' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
