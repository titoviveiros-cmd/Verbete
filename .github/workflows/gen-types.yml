name: Gen Types

# Fase 10: regenera src/integrations/supabase/types.ts a partir das migrations
# (Supabase local no runner — a máquina de dev não tem Docker) e commita de
# volta quando houver drift. Fim dos casts `as any` nas RPCs: o compilador
# passa a conhecer todas as funções/tabelas reais.
on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/gen-types.yml"
  workflow_dispatch:

jobs:
  gen-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase local (aplica todas as migrations)
        run: supabase start

      - name: Gerar tipos
        run: supabase gen types typescript --local --schema public > src/integrations/supabase/types.ts

      - name: Formatar com o Prettier do projeto
        # Sem isto o commit do bot quebra o step de Lint do CI (o gerador
        # não segue o prettier.config — regressão real em 2026-08-04).
        run: npx --yes prettier --write src/integrations/supabase/types.ts

      - name: Commitar se houver drift
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "Tipos já atualizados — nada a commitar."
            exit 0
          fi
          git config user.name "verbete-ci"
          git config user.email "ci@verbete.local"
          git add src/integrations/supabase/types.ts
          git commit -m "chore: regenerar tipos do Supabase a partir das migrations [skip ci]"
          git push
